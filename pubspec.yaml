name: whatsapp

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:

  flutter:
    sdk: flutter

  firebase_core: ^3.15.1

  firebase_auth: ^5.6.1

  cloud_firestore: ^5.6.10

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:

  android: true

  ios: true

  image_path: "assets/icon/icon.png"

  min_sdk_android: 21